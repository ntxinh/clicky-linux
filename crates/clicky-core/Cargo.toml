[package]
name = "clicky-core"
description = "clicky engine core: evdev input, normalization, lock-free mixer, profiles, config"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[dependencies]
evdev = "0.12"
rtrb = "0.3"
# cpal's alsa dep is non-optional on Linux — needs alsa-lib-devel.
# Uncomment after tools/setup.sh:
# cpal = "0.15"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
symphonia = { version = "0.5", features = ["mp3"] }
anyhow = "1"
thiserror = "2"
fastrand = "2"
# libudev-devel missing until tools/setup.sh runs:
# udev = "0.9"
# nix::sys::epoll is gated by the "event" feature (which implies "poll") in nix 0.30
nix = { version = "0.30", features = ["event", "fs"] }
directories = "6"
