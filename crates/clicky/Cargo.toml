[package]
name = "clicky"
description = "Mechanical keyboard sound engine daemon + settings app"
version = "0.1.0"
edition.workspace = true
license.workspace = true
default-run = "clicky"

# RPM: `cargo build --release --workspace && cargo generate-rpm -p clicky`
# (tool: cargo-generate-rpm — no rpmbuild/spec needed; lands in
# target/generate-rpm/, tools/package.sh copies it to dist/). The udev rule
# ships in the package; post-install reloads udevd (log out/in or replug to
# activate the uaccess ACL).
[package.metadata.generate-rpm]
summary = "Mechanical keyboard sounds, system-wide on Wayland"
assets = [
    { source = "target/release/clicky", dest = "/usr/bin/clicky", mode = "755" },
    { source = "target/release/clicky-overlay", dest = "/usr/bin/clicky-overlay", mode = "755" },
    { source = "sounds/**/*", dest = "/usr/share/clicky/sounds/", mode = "644" },
    { source = "packaging/clicky.desktop", dest = "/usr/share/applications/clicky.desktop", mode = "644" },
    { source = "packaging/clicky.svg", dest = "/usr/share/icons/hicolor/scalable/apps/clicky.svg", mode = "644" },
    { source = "udev/99-clicky-uaccess.rules", dest = "/usr/lib/udev/rules.d/99-clicky-uaccess.rules", mode = "644" },
]
post_install_script = "udevadm control --reload || true\nudevadm trigger || true"

# Recommends (not Requires): the tray isn't wired yet — libayatana isn't in
# the build sysroot. Declared here so the packaged system already has it when
# the SNI tray lands; upgrade to `requires` at that point.
[package.metadata.generate-rpm.recommends]
libayatana-appindicator-gtk3 = "*"

[dependencies]
clicky-core = { path = "../clicky-core" }
cpal = "0.15"
parking_lot = "0.12"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
directories = "6"
libc = "0.2"
# No tray-icon feature: libayatana-appindicator isn't in the sysroot (and is
# unavailable on many Wayland sessions) — the UI degrades to a plain window.
tauri = { version = "2", features = [] }

[build-dependencies]
tauri-build = { version = "2", features = [] }
