[package]
name = "clicky"
description = "Mechanical keyboard sound engine daemon + settings app"
version = "0.1.0"
edition.workspace = true
license.workspace = true
default-run = "clicky"

[dependencies]
clicky-core = { path = "../clicky-core" }
cpal = "0.15"
parking_lot = "0.12"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
directories = "6"
libc = "0.2"
# No tray-icon feature: libayatana-appindicator isn't in the sysroot (and is
# unavailable on many Wayland sessions) — the UI degrades to a plain window.
tauri = { version = "2", features = [] }

[build-dependencies]
tauri-build = { version = "2", features = [] }
